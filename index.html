<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>BAPLIE Studio</title>
<style>
:root{
  --bg:#0b0b0d; --panel:#141417; --panel2:#1b1b20; --line:#2a2a31; --line2:#35353d;
  --text:#ececef; --muted:#9a9aa5; --dim:#6c6c76;
  --or:#ff7a1a; --or2:#ff9a4d; --orbg:rgba(255,122,26,.12); --orbd:rgba(255,122,26,.45);
  --ok:#3ecf8e; --warn:#ffb020; --err:#ff5d5d; --blue:#5aa9ff;
  --r:10px; --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2c2c33;border-radius:6px;border:2px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}
.app{display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#08080a;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.3px;font-size:16px}
.logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--or),#c04d00);display:grid;place-items:center;color:#000;font-weight:900}
.logo small{color:var(--muted);font-weight:500;margin-left:4px}
.fileinfo{display:flex;gap:8px;align-items:center;margin-left:8px;min-width:0}
.pill{padding:3px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.pill.or{color:var(--or2);border-color:var(--orbd);background:var(--orbg)}
.pill.ok{color:var(--ok);border-color:rgba(62,207,142,.4)}
.pill.bad{color:var(--err);border-color:rgba(255,93,93,.4);cursor:pointer}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-weight:600;font-size:13px;transition:.15s}
.btn:hover{border-color:var(--or);color:var(--or2)}
.btn.primary{background:var(--or);border-color:var(--or);color:#111}
.btn.primary:hover{background:var(--or2);color:#000}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sm{padding:5px 10px;font-size:12px}
.landing{flex:1;display:grid;place-items:center;padding:30px}
.drop{width:min(720px,100%);border:2px dashed var(--line2);border-radius:18px;padding:56px 30px;text-align:center;background:radial-gradient(ellipse at top,rgba(255,122,26,.07),transparent 60%),var(--panel);transition:.2s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--or);background:radial-gradient(ellipse at top,rgba(255,122,26,.16),transparent 60%),var(--panel)}
.drop .ic{width:74px;height:74px;margin:0 auto 18px;border-radius:18px;background:var(--orbg);border:1px solid var(--orbd);display:grid;place-items:center}
.drop h2{margin:0 0 6px;font-size:22px}
.drop p{margin:4px 0;color:var(--muted)}
.drop .row{margin-top:22px;display:flex;gap:10px;justify-content:center}
.note{margin-top:22px;font-size:12px;color:var(--dim)}
.main{flex:1;display:none;min-height:0}
.side{width:300px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 14px 30px}
.side h3{margin:0;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.sidehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.fgroup{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--panel2)}
.fgroup>summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:13px}
.fgroup>summary::-webkit-details-marker{display:none}
.fgroup>summary .cnt{font-size:11px;color:var(--or2);background:var(--orbg);border-radius:99px;padding:1px 8px;display:none}
.fgroup>summary .cnt.on{display:inline-block}
.fgroup>summary:after{content:"▾";color:var(--dim);margin-left:8px}
.fgroup:not([open])>summary:after{content:"▸"}
.fbody{padding:0 12px 12px}
.ms-tools{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.ms-tools input{flex:1;min-width:0}
.link{background:none;border:none;color:var(--or2);cursor:pointer;font-size:12px;padding:2px 4px}
.link:hover{text-decoration:underline}
.ms-list{max-height:190px;overflow:auto;border-top:1px solid var(--line);padding-top:4px}
.ms-item{display:flex;align-items:center;gap:8px;padding:4px 4px;border-radius:6px;cursor:pointer;font-size:13px}
.ms-item:hover{background:#23232a}
.ms-item .c{margin-left:auto;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.ms-item.hide{display:none}
input[type=checkbox],input[type=radio]{accent-color:var(--or);width:15px;height:15px;margin:0}
.inp{background:#0f0f12;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;outline:none;width:100%}
.inp:focus{border-color:var(--or)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:99px;border:1px solid var(--line2);background:#101013;cursor:pointer;font-size:12px;user-select:none}
.chip:hover{border-color:var(--or)}
.chip.on{background:var(--orbg);border-color:var(--or);color:var(--or2)}
.chip .c{color:var(--dim);margin-left:4px}
.tri{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:8px;margin:6px 0}
.seg{display:flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg button{flex:1;background:#101013;border:none;padding:4px 0;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--or);color:#111;font-weight:700}
.range{display:flex;gap:6px;align-items:center}
.range span{color:var(--dim)}
.lbl{font-size:12px;color:var(--muted);margin:8px 0 4px}
.hint{font-size:11px;color:var(--dim);margin-top:6px}
.content{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.voy{display:flex;flex-wrap:wrap;gap:18px;padding:12px 18px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(255,122,26,.08),transparent 50%)}
.voy .kv b{display:block;font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.6px}
.voy .kv span{font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:12px 18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--or)}
.stat b{display:block;font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.6px}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .t{font-size:12px;color:var(--dim)}
.tabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line)}
.tab{padding:10px 14px;border:none;background:none;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
.tab:hover{color:var(--text)}
.tab.on{color:var(--or2);border-bottom-color:var(--or)}
.pane{flex:1;overflow:auto;padding:14px 18px 20px;display:none}
.pane.on{display:block}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.toolbar .muted{color:var(--muted);font-size:13px}
table.grid{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.grid th{position:sticky;top:0;background:#1e1e24;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
.grid th:hover{color:var(--text)}
.grid th.s{color:var(--or2)}
.grid th .ar{font-size:10px;margin-left:4px}
.grid td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.grid tbody tr{cursor:pointer}
.grid tbody tr:nth-child(even) td{background:#111114}
.grid tbody tr:hover td{background:#221a14}
.grid td.n,.grid th.n{text-align:right;font-variant-numeric:tabular-nums}
.grid .mono{font-family:var(--mono);font-size:12.5px}
.tblwrap{border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:calc(100vh - 360px);min-height:200px}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;font-weight:700}
.t-full{background:rgba(62,207,142,.12);color:var(--ok)}
.t-empty{background:#26262d;color:var(--muted)}
.t-rf{background:rgba(90,169,255,.14);color:var(--blue)}
.t-dg{background:rgba(255,93,93,.14);color:var(--err)}
.t-oog{background:rgba(255,176,32,.14);color:var(--warn)}
.pager{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:13px}
.pager select{background:#0f0f12;border:1px solid var(--line2);border-radius:6px;padding:4px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.grid tr.tot td{background:#1a1510!important;font-weight:700;color:var(--or2)}
.bar{height:6px;background:#23232a;border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--or)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1300px){.two{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h4{margin:0 0 10px;font-size:13px;color:var(--or2);text-transform:uppercase;letter-spacing:.8px}
.kvgrid{display:grid;grid-template-columns:180px 1fr;gap:6px 12px;font-size:13px}
.kvgrid div:nth-child(odd){color:var(--muted)}
.vlist{list-style:none;padding:0;margin:0}
.vlist li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
.vlist li:last-child{border-bottom:none}
pre.raw{background:#08080a;border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--mono);font-size:12.5px;overflow:auto;max-height:340px;margin:0;white-space:pre}
pre.raw .tg{color:var(--or2);font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
.overlay.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:min(780px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal header{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0;font-size:16px}
.modal .body{padding:16px 18px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
.x:hover{color:var(--or)}
.dropveil{position:fixed;inset:0;background:rgba(255,122,26,.10);border:3px dashed var(--or);z-index:60;display:none;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--or2);pointer-events:none}
.dropveil.on{display:flex}
.toast{position:fixed;right:20px;bottom:20px;z-index:70;display:flex;flex-direction:column;gap:8px}
.toast div{background:#1d1d22;border:1px solid var(--line2);border-left:4px solid var(--or);padding:10px 14px;border-radius:8px;max-width:420px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:in .2s}
.toast div.ok{border-left-color:var(--ok)}.toast div.err{border-left-color:var(--err)}
@keyframes in{from{transform:translateY(10px);opacity:0}}
.expsum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.warnbox{background:rgba(255,176,32,.08);border:1px solid rgba(255,176,32,.35);color:#ffd27a;border-radius:8px;padding:10px 12px;font-size:13px;margin-top:10px}
.clickable{cursor:pointer}.clickable:hover{color:var(--or2);text-decoration:underline}
/* Export mode options */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mode{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line2);border-radius:10px;padding:12px;cursor:pointer;background:var(--panel2);transition:.15s}
.mode:hover{border-color:var(--orbd)}
.mode.on{border-color:var(--or);background:var(--orbg)}
.mode input{margin-top:3px}
.mode b{display:block;font-size:14px}
.mode span{font-size:12px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
.opt{display:flex;gap:9px;align-items:flex-start;font-size:13px;cursor:pointer}
.opt input{margin-top:2px}
.opt small{display:block;color:var(--dim);font-size:12px}
.flist{border:1px solid var(--line);border-radius:8px;max-height:230px;overflow:auto;margin-top:6px}
.flist table{width:100%;border-collapse:collapse;font-size:12.5px}
.flist th{position:sticky;top:0;background:#1e1e24;color:var(--muted);text-align:left;padding:6px 10px;font-weight:600}
.flist td{padding:6px 10px;border-top:1px solid var(--line)}
.flist td.n,.flist th.n{text-align:right;font-variant-numeric:tabular-nums}
.flist .mono{font-family:var(--mono)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo"><div class="mark">B</div>BAPLIE Studio<small>view · filter · export</small></div>
    <div class="fileinfo" id="fileinfo"></div>
    <div class="spacer"></div>
    <button class="btn" id="btnOpen">Open file</button>
    <button class="btn" id="btnClear" disabled>Close</button>
    <button class="btn primary" id="btnExport" disabled>⬇ Export filtered BAPLIE</button>
    <input type="file" id="fileInput" accept=".edi,.txt,.bap,.baplie,.edifact,*/*" hidden>
  </div>
  <div class="landing" id="landing">
    <div class="drop" id="drop">
      <div class="ic"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#ff7a1a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m6 10 6-6 6 6"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></div>
      <h2>Drop a BAPLIE EDI file here</h2>
      <p>or click to browse · supports BAPLIE 2.x (D.95B / SMDG 2.x) and 3.x (D.13B / SMDG 3.x)</p>
      <div class="row">
        <button class="btn primary" id="btnBrowse">Browse file</button>
        <button class="btn" id="btnSample">Load demo file</button>
      </div>
      <div class="note">Files are processed entirely in your browser. Nothing is uploaded or sent anywhere.</div>
    </div>
  </div>
  <div class="main" id="main">
    <aside class="side" id="side"></aside>
    <section class="content">
      <div class="voy" id="voy"></div>
      <div class="stats" id="stats"></div>
      <div class="tabs" id="tabs">
        <button class="tab on" data-tab="cont">Containers</button>
        <button class="tab" data-tab="ops">Operator summary</button>
        <button class="tab" data-tab="ports">Port summary</button>
        <button class="tab" data-tab="info">Header &amp; validation</button>
      </div>
      <div class="pane on" id="pane-cont"></div>
      <div class="pane" id="pane-ops"></div>
      <div class="pane" id="pane-ports"></div>
      <div class="pane" id="pane-info"></div>
    </section>
  </div>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="dropveil" id="dropveil">Drop BAPLIE file to load</div>
<div class="toast" id="toast"></div>
<script>
/* ================= BAPLIE CORE (parser / extractor / exporter) ================= */
const BP = (() => {
  'use strict';

  // ---------- Low-level EDIFACT tokenising ----------
  function readEnvelope(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    text = text.replace(/^\s+/, '');
    const d = { comp: ':', elem: '+', dec: '.', rel: '?', rep: ' ', seg: "'" };
    let una = null, body = text;
    if (text.startsWith('UNA') && text.length >= 9) {
      d.comp = text[3]; d.elem = text[4]; d.dec = text[5]; d.rel = text[6]; d.rep = text[7]; d.seg = text[8];
      una = text.slice(0, 9);
      body = text.slice(9);
    }
    let lineEnd = '';
    if (body.includes(d.seg + '\r\n')) lineEnd = '\r\n';
    else if (body.includes(d.seg + '\n')) lineEnd = '\n';
    const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const wrapped = new RegExp('[^' + esc(d.seg) + '\\r\\n][\\r\\n]').test(body.replace(/[\r\n]+$/, ''));
    if (wrapped) { body = body.replace(/[\r\n]+/g, ''); lineEnd = ''; }
    return { d, una, body, lineEnd, wrapped };
  }

  function splitSegments(body, d) {
    const out = []; let cur = '';
    const push = () => { const s = cur.replace(/^\s+/, '').replace(/[\r\n]+$/, ''); if (s.length) out.push(s); cur = ''; };
    for (let i = 0; i < body.length; i++) {
      const c = body[i];
      if (c === d.rel && d.rel !== ' ') { cur += c; if (i + 1 < body.length) cur += body[++i]; continue; }
      if (c === d.seg) { push(); continue; }
      cur += c;
    }
    if (cur.trim().length) push();
    return out;
  }

  function splitEsc(str, sep, rel) {
    const out = []; let cur = '';
    for (let i = 0; i < str.length; i++) {
      const c = str[i];
      if (c === rel && rel !== ' ') { cur += c; if (i + 1 < str.length) cur += str[++i]; continue; }
      if (c === sep) { out.push(cur); cur = ''; continue; }
      cur += c;
    }
    out.push(cur); return out;
  }
  function unesc(s, rel) {
    if (rel === ' ' || !s.includes(rel)) return s;
    let o = '';
    for (let i = 0; i < s.length; i++) { if (s[i] === rel && i + 1 < s.length) o += s[++i]; else o += s[i]; }
    return o;
  }
  function parseSeg(raw, d) {
    const rawEl = splitEsc(raw, d.elem, d.rel);
    return { raw, rawEl, tag: rawEl[0].trim().toUpperCase(), el: rawEl.map(e => splitEsc(e, d.comp, d.rel).map(c => unesc(c, d.rel))) };
  }
  const g = (s, i, j = 0) => (s && s.el[i] && s.el[i][j] != null) ? s.el[i][j].trim() : '';

  // ---------- Structure ----------
  function parse(text) {
    const env = readEnvelope(text);
    const segs = splitSegments(env.body, env.d).map(r => parseSeg(r, env.d));
    const items = []; const warnings = []; let msg = null;
    for (const s of segs) {
      if (s.tag === 'UNH') {
        if (msg) { warnings.push('Message ' + g(msg.unh, 1) + ' has no UNT before the next UNH.'); items.push({ type: 'msg', msg }); }
        msg = { unh: s, header: [s], blocks: [], unt: null }; continue;
      }
      if (msg) {
        if (s.tag === 'UNT') { msg.unt = s; items.push({ type: 'msg', msg }); msg = null; continue; }
        if (s.tag === 'LOC' && g(s, 1) === '147') { msg.blocks.push({ segs: [s] }); continue; }
        if (msg.blocks.length) msg.blocks[msg.blocks.length - 1].segs.push(s); else msg.header.push(s);
      } else items.push({ type: 'seg', seg: s });
    }
    if (msg) { warnings.push('Message ' + g(msg.unh, 1) + ' has no UNT segment.'); items.push({ type: 'msg', msg }); }
    const messages = items.filter(i => i.type === 'msg').map(i => i.msg);
    const parsed = { ...env, segCount: segs.length, items, messages, warnings };
    parsed.validation = validate(parsed);
    return parsed;
  }

  function validate(p) {
    const issues = [...(p.warnings || [])]; const ok = [];
    const unb = p.items.find(i => i.type === 'seg' && i.seg.tag === 'UNB');
    const unz = p.items.find(i => i.type === 'seg' && i.seg.tag === 'UNZ');
    if (!unb) issues.push('UNB (interchange header) not found.'); else ok.push('UNB interchange header present.');
    if (!unz) issues.push('UNZ (interchange trailer) not found.');
    if (!p.messages.length) issues.push('No UNH/UNT message found.');
    p.messages.forEach((m, i) => {
      const type = g(m.unh, 2, 0);
      if (type && type !== 'BAPLIE') issues.push(`Message ${i + 1} is type "${type}", not BAPLIE.`);
      const actual = m.header.length + m.blocks.reduce((a, b) => a + b.segs.length, 0) + 1;
      if (m.unt) {
        const declared = parseInt(g(m.unt, 1), 10);
        if (declared !== actual) issues.push(`Message ${g(m.unh, 1)}: UNT declares ${declared} segments, actual is ${actual}.`);
        else ok.push(`Message ${g(m.unh, 1)}: UNT segment count ${actual} matches.`);
        if (g(m.unt, 2) !== g(m.unh, 1)) issues.push(`Message reference mismatch: UNH "${g(m.unh, 1)}" vs UNT "${g(m.unt, 2)}".`);
      }
      if (!m.blocks.length) issues.push(`Message ${g(m.unh, 1)} contains no stowage positions (LOC+147).`);
    });
    if (unb && unz) {
      if (g(unb.seg, 5) !== g(unz.seg, 2)) issues.push(`Interchange reference mismatch: UNB "${g(unb.seg, 5)}" vs UNZ "${g(unz.seg, 2)}".`);
      const n = parseInt(g(unz.seg, 1), 10);
      if (n !== p.messages.length) issues.push(`UNZ declares ${n} message(s), found ${p.messages.length}.`);
      else ok.push(`UNZ message count ${n} matches.`);
    }
    return { issues, ok, valid: issues.length === 0 };
  }

  // ---------- Business extraction ----------
  const SIZE = { '1': '10', '2': '20', '3': '30', '4': '40', 'L': '45', 'M': '48', 'P': '53', 'B': '24', 'C': '24', 'G': '41', 'H': '43', 'K': '44' };
  const HEIGHT = { '0': "8'", '2': "8'6\"", '4': "9'", '5': "9'6\"", '6': ">9'6\"", '8': "4'3\"", '9': "≤4'" };
  function typeOf(iso) {
    if (!iso || iso.length < 3) return 'Unknown';
    const t = iso[2];
    if (/[A-Z]/i.test(t)) return ({ G: 'General', V: 'Ventilated', B: 'Bulk', S: 'Named cargo', R: 'Reefer', H: 'Insulated', U: 'Open top', P: 'Flat rack', T: 'Tank', K: 'Tank', N: 'Tank', A: 'Air/Surface' })[t.toUpperCase()] || 'Other';
    const n = parseInt(iso.slice(2, 4), 10);
    if (isNaN(n)) return 'Other';
    if (n < 20) return 'General'; if (n < 30) return 'Insulated'; if (n < 50) return 'Reefer';
    if (n < 60) return 'Open top'; if (n < 70) return 'Flat rack'; if (n < 80) return 'Tank'; if (n < 90) return 'Bulk';
    return 'Other';
  }
  const teuOf = size => { const n = parseFloat(size); if (!n) return 0; return n <= 10 ? 0.5 : n < 30 ? 1 : n < 40 ? 1.5 : 2; };
  const OOG_Q = new Set(['5', '6', '7', '8', '9', '10', '11', '12', '13', 'OVF', 'OVB', 'OVR', 'OVL', 'OVH']);
  const OOG_LBL = { '5': 'F', '6': 'B', '7': 'R', '8': 'L', '9': 'H', 'OVF': 'F', 'OVB': 'B', 'OVR': 'R', 'OVL': 'L', 'OVH': 'H' };

  function extract(block, msgIdx, idx) {
    const r = { idx, msgIdx, block, pos: '', bay: null, row: null, tier: null, posSort: 0, cntr: '', iso: '', size: '', height: '', type: '', fe: '',
      operator: '', pol: '', pod: '', dlv: '', weight: null, wUnit: '', vgm: false, temp: '', tempUnit: '', reefer: false,
      dgList: [], dg: '', oog: '', booking: '', eqdCount: 0, handling: [] };
    let wCand = [];
    for (const s of block.segs) {
      switch (s.tag) {
        case 'LOC': {
          const q = g(s, 1), v = g(s, 2);
          if (q === '147' && !r.pos) {
            r.pos = v;
            const p = v.replace(/\D/g, '');
            const p7 = p.length >= 7 ? p.slice(-7) : p.padStart(7, '0');
            if (p.length >= 5) {
              r.bay = parseInt(p7.slice(0, 3), 10); r.row = parseInt(p7.slice(3, 5), 10); r.tier = parseInt(p7.slice(5, 7), 10);
              r.posSort = r.bay * 1e4 + r.row * 1e2 + r.tier;
            }
          } else if (q === '9' && !r.pol) r.pol = v;
          else if (q === '11' && !r.pod) r.pod = v;
          else if (q === '83' && !r.dlv) r.dlv = v;
          break;
        }
        case 'EQD': {
          r.eqdCount++;
          if (!r.cntr) {
            r.cntr = g(s, 2); r.iso = g(s, 3);
            const fe = g(s, 6);
            r.fe = fe === '5' ? 'Full' : fe === '4' ? 'Empty' : (fe || '');
          }
          break;
        }
        case 'NAD': {
          const q = g(s, 1);
          if ((q === 'CA' || q === 'CF') && !r.operator) r.operator = g(s, 2);
          break;
        }
        case 'MEA': {
          const q1 = g(s, 1), q2 = g(s, 2), unit = g(s, 3, 0), val = parseFloat(g(s, 3, 1));
          if (!isNaN(val)) wCand.push({ q: (q1 + '/' + q2).toUpperCase(), unit, val });
          break;
        }
        case 'TMP': { r.temp = g(s, 2, 0); r.tempUnit = g(s, 2, 1); r.reefer = true; break; }
        case 'DGS': { const cls = g(s, 2), un = g(s, 3); r.dgList.push((cls || '?') + (un ? '/' + un : '')); break; }
        case 'DIM': { const q = g(s, 1).toUpperCase(); if (OOG_Q.has(q)) { const l = OOG_LBL[q] || q; if (!r.oog.includes(l)) r.oog += l; } break; }
        case 'RFF': { const q = g(s, 1).toUpperCase(); const v = g(s, 1, 1); if ((q === 'BN' || q === 'BM') && v && v !== '1' && !r.booking) r.booking = v; break; }
        case 'HAN': { const h = g(s, 1); if (h) r.handling.push(h); break; }
      }
    }
    const pick = wCand.find(w => w.q.includes('VGM')) || wCand.find(w => /(^|\/)(AET|WT|G|AAE)(\/|$)/.test(w.q)) || wCand[0];
    if (pick) {
      r.vgm = pick.q.includes('VGM'); r.wUnit = pick.unit;
      r.weight = /LBR|LB/i.test(pick.unit) ? Math.round(pick.val * 0.45359237) : pick.val;
    }
    r.size = SIZE[(r.iso[0] || '').toUpperCase()] || (r.iso ? '?' : '');
    r.height = HEIGHT[r.iso[1]] || '';
    r.type = r.iso ? typeOf(r.iso) : '';
    if (r.type === 'Reefer' && r.temp) r.reefer = true;
    r.teu = teuOf(r.size);
    r.dg = r.dgList.join(', ');
    r.isDG = r.dgList.length > 0;
    r.isOOG = !!r.oog;
    if (!r.cntr) r.cntr = r.eqdCount ? '(no id)' : '(empty slot)';
    return r;
  }

  function extractRecords(p) {
    const recs = [];
    p.messages.forEach((m, mi) => m.blocks.forEach(b => recs.push(extract(b, mi, recs.length))));
    return recs;
  }

  function headerInfo(p) {
    const m = p.messages[0]; const info = {};
    const unb = p.items.find(i => i.type === 'seg' && i.seg.tag === 'UNB');
    if (unb) {
      info.syntax = g(unb.seg, 1, 0) + ':' + g(unb.seg, 1, 1);
      info.sender = g(unb.seg, 2); info.recipient = g(unb.seg, 3);
      info.prepared = fmtDate(g(unb.seg, 4, 0) + g(unb.seg, 4, 1), g(unb.seg, 4, 0).length === 8 ? '203' : '201');
      info.interchangeRef = g(unb.seg, 5);
    }
    if (!m) return info;
    const t = m.unh.el[2] || [];
    info.messageType = (t[0] || '');
    info.version = [t[1], t[2], t[3]].filter(Boolean).join(':');
    info.assoc = t[4] || '';
    info.messageRef = g(m.unh, 1);
    for (const s of m.header) {
      if (s.tag === 'BGM') info.docNo = g(s, 2) || g(s, 1);
      if (s.tag === 'TDT' && !info.voyage) {
        info.voyage = g(s, 2);
        info.carrier = g(s, 5);
        const v = s.el[8] || [];
        info.vesselId = (v[0] || '').trim(); info.vesselIdType = (v[1] || '').trim();
        info.vesselName = (v[3] || '').trim() || (v[0] || '').trim();
      }
      if (s.tag === 'LOC') {
        if (g(s, 1) === '5') info.depPort = g(s, 2);
        if (g(s, 1) === '61') info.nextPort = g(s, 2);
      }
      if (s.tag === 'DTM') {
        const q = g(s, 1), v = g(s, 1, 1), f = g(s, 1, 2);
        const lbl = { '137': 'docDate', '178': 'ata', '132': 'eta', '133': 'etd', '136': 'atd' }[q];
        if (lbl && !info[lbl]) info[lbl] = fmtDate(v, f);
      }
    }
    return info;
  }

  function fmtDate(v, f) {
    if (!v) return '';
    let y, mo, d, h = '', mi = '';
    if ((f === '203' || v.length === 12) && v.length >= 12) { y = v.slice(0, 4); mo = v.slice(4, 6); d = v.slice(6, 8); h = v.slice(8, 10); mi = v.slice(10, 12); }
    else if (v.length === 10) { y = '20' + v.slice(0, 2); mo = v.slice(2, 4); d = v.slice(4, 6); h = v.slice(6, 8); mi = v.slice(8, 10); }
    else if (v.length === 8) { y = v.slice(0, 4); mo = v.slice(4, 6); d = v.slice(6, 8); }
    else if (v.length === 6) { y = '20' + v.slice(0, 2); mo = v.slice(2, 4); d = v.slice(4, 6); }
    else return v;
    return `${y}-${mo}-${d}` + (h ? ` ${h}:${mi}` : '');
  }

  // ---------- Export ----------
  // Unique interchange control reference (UNB 0020 / UNZ 0020, an..14) derived from the original one.
  function deriveRef(orig, seq) {
    const suffix = String(seq).padStart(3, '0');
    const base = (orig || 'REF').replace(/[^A-Za-z0-9]/g, '');
    return (base.slice(0, 14 - suffix.length) + suffix).slice(0, 14);
  }

  // keep: Set of block objects to retain. Original segment text is re-emitted byte-for-byte;
  // UNT segment counts are recalculated. opts.interchangeRef (optional) replaces the
  // interchange control reference consistently in UNB and UNZ.
  function buildExport(p, keep, opts = {}) {
    const d = p.d, T = d.seg, NL = p.lineEnd;
    const out = [];
    const emit = raw => out.push(raw + T + NL);
    const ref = opts.interchangeRef;
    const withRef = (seg, idx) => {
      if (!ref || seg.rawEl.length <= idx) return seg.raw;
      const els = seg.rawEl.slice();
      const comps = splitEsc(els[idx], d.comp, d.rel); comps[0] = ref; els[idx] = comps.join(d.comp);
      return els.join(d.elem);
    };
    const head = p.una ? p.una + NL : '';
    for (const it of p.items) {
      if (it.type === 'seg') {
        if (it.seg.tag === 'UNB') emit(withRef(it.seg, 5));
        else if (it.seg.tag === 'UNZ') emit(withRef(it.seg, 2));
        else emit(it.seg.raw);
        continue;
      }
      const m = it.msg;
      let count = m.header.length + 1;
      m.header.forEach(s => emit(s.raw));
      for (const b of m.blocks) { if (keep.has(b)) { b.segs.forEach(s => emit(s.raw)); count += b.segs.length; } }
      if (m.unt) {
        const els = m.unt.rawEl.slice();
        els[1] = String(count);
        emit(els.join(d.elem));
      } else {
        emit(['UNT', String(count), m.unh.rawEl[1] || '1'].join(d.elem));
      }
    }
    return head + out.join('');
  }

  // Build and self-validate one export. Returns { text, count, problems }.
  function exportAndCheck(p, blocks, opts) {
    const keep = new Set(blocks);
    const text = buildExport(p, keep, opts);
    const chk = parse(text);
    const recs = extractRecords(chk);
    const srcIssues = new Set(p.validation.issues);
    const problems = chk.validation.issues.filter(x => !srcIssues.has(x) && !(/contains no stowage/.test(x) && keep.size === 0));
    if (recs.length !== keep.size) problems.push(`Container count mismatch (${recs.length} vs ${keep.size}).`);
    if (opts && opts.expectOperator != null) {
      const bad = recs.filter(r => (r.operator || '') !== opts.expectOperator).length;
      if (bad) problems.push(`${bad} container(s) with a different operator found in the file.`);
    }
    return { text, count: recs.length, problems };
  }

  // ---------- Demo sample (BAPLIE 2.2 / D.95B) ----------
  function makeSample() {
    let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const pickR = a => a[Math.floor(rnd() * a.length)];
    const ops = ['XPF', 'MSK', 'ONE', 'CMA', 'HLC', 'EGL'];
    const pods = ['THLCH', 'THBKK', 'VNSGN', 'MYPKG'];
    const segs = [
      "UNB+UNOA:2+XPF+PARTNER+260929:1200+SMP0001",
      "UNH+1+BAPLIE:D:95B:UN:SMDG22",
      "BGM++SAMPLE0240N+9",
      "DTM+137:2609291200:201",
      "TDT+20+0240N+++XPF:172:20+++9V1234:103::XPRESS SAMPLE",
      "LOC+5+SGSIN:139:6",
      "LOC+61+THLCH:139:6",
      "DTM+178:2609291000:201",
      "DTM+132:2610011800:201",
      "DTM+136:2609292200:201"
    ];
    const ck = id => {
      const map = {}; let v = 10;
      for (let c = 65; c <= 90; c++) { if (v % 11 === 0) v++; map[String.fromCharCode(c)] = v++; }
      let sum = 0; for (let i = 0; i < 10; i++) { const ch = id[i]; const n = /\d/.test(ch) ? +ch : map[ch]; sum += n * Math.pow(2, i); }
      return (sum % 11) % 10;
    };
    let n = 0;
    for (let bay = 2; bay <= 22; bay += 4) {
      for (let row = 1; row <= 6; row++) {
        for (let tier of [82, 84]) {
          if (rnd() < 0.2) continue;
          const op = pickR(ops); const pod = pickR(pods);
          const reefer = rnd() < 0.12, dg = !reefer && rnd() < 0.1, oog = !reefer && !dg && rnd() < 0.05;
          const empty = !reefer && !dg && rnd() < 0.15;
          const is20 = rnd() < 0.35;
          const iso = reefer ? (is20 ? '22R1' : '45R1') : oog ? '45P3' : (is20 ? '22G1' : (rnd() < 0.7 ? '45G1' : '42G1'));
          const b = is20 ? bay - 1 : bay;
          const pos = String(b).padStart(3, '0') + String(row).padStart(2, '0') + String(tier);
          const prefix = { XPF: 'XPFU', MSK: 'MSKU', ONE: 'ONEU', CMA: 'CMAU', HLC: 'HLXU', EGL: 'EGHU' }[op];
          const base = prefix + String(100000 + (n * 7919) % 900000).padStart(6, '0');
          const cntr = base + ck(base);
          const w = empty ? (is20 ? 2200 : 3900) : Math.round((is20 ? 8000 + rnd() * 16000 : 10000 + rnd() * 18000) / 10) * 10;
          segs.push(`LOC+147+${pos}::5`);
          segs.push(`MEA+VGM++KGM:${w}`);
          if (oog) segs.push('DIM+9+CMT:::45', 'DIM+7+CMT::20');
          if (reefer) segs.push(`TMP+2+${pickR(['-18.0', '-25.0', '002.0', '013.0'])}:CEL`);
          segs.push('LOC+9+SGSIN', `LOC+11+${pod}`, `LOC+83+${pod}`, 'RFF+BM:1');
          if (!empty) segs.push(`RFF+BN:${op}SIN${String(4000 + n).padStart(6, '0')}`);
          segs.push(`EQD+CN+${cntr}+${iso}+++${empty ? 4 : 5}`, `NAD+CA+${op}:172:20`);
          if (dg) segs.push(`DGS+IMD+${pickR(['3', '8', '9', '2.1'])}+${pickR(['1263', '1760', '3077', '1950'])}`);
          n++;
        }
      }
    }
    const cnt = segs.length - 1 + 1;
    segs.push(`UNT+${cnt}+1`, 'UNZ+1+SMP0001');
    return segs.join("'\n") + "'\n";
  }

  return { parse, extractRecords, headerInfo, buildExport, exportAndCheck, deriveRef, validate, makeSample, fmtDate };
})();


</script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const nf = n => (n == null || isNaN(n)) ? '' : Number(n).toLocaleString('en-US', { maximumFractionDigits: 1 });
const BLANK = '(blank)';

const S = { name: '', parsed: null, info: {}, recs: [], filtered: [], sort: { k: 'pos', dir: 1 }, page: 1, size: 100, f: null,
  exp: { mode: 'single', delivery: 'zip', uniqueRef: true, includeBlank: true } };

const newFilters = () => ({ op: new Set(), pol: new Set(), pod: new Set(), dlv: new Set(), size: new Set(), type: new Set(), fe: new Set(),
  reefer: 'any', dg: 'any', oog: 'any', bayFrom: '', bayTo: '', wMin: '', wMax: '', q: '' });

/* ---------------- Loading ---------------- */
function loadFile(file) {
  if (!file) return;
  if (file.size > 60 * 1024 * 1024) return toast('File is larger than 60 MB – is this really a BAPLIE?', 'err');
  const rd = new FileReader();
  rd.onload = () => loadText(rd.result, file.name);
  rd.onerror = () => toast('Could not read file.', 'err');
  rd.readAsText(file, 'ISO-8859-1'); // byte-preserving read; export writes the same bytes back
}
function loadText(text, name) {
  let p;
  try { p = BP.parse(text); } catch (e) { return toast('Unable to parse file: ' + e.message, 'err'); }
  if (!p.messages.length || !p.messages.some(m => m.blocks.length)) {
    return toast('No BAPLIE stowage data (UNH … LOC+147 … UNT) found in "' + name + '".', 'err');
  }
  const type = (p.messages[0].unh.el[2] || [])[0];
  if (type && type.trim() !== 'BAPLIE') toast('Warning: message type is "' + type + '", not BAPLIE. Proceeding anyway.', 'warn');
  S.name = name; S.parsed = p; S.info = BP.headerInfo(p); S.recs = BP.extractRecords(p);
  S.f = newFilters(); S.sort = { k: 'pos', dir: 1 }; S.page = 1;
  $('#landing').style.display = 'none'; $('#main').style.display = 'flex';
  $('#btnExport').disabled = false; $('#btnClear').disabled = false;
  renderFileInfo(); renderSidebar(); renderVoyage(); renderInfo(); apply();
  toast(`Loaded ${S.recs.length.toLocaleString()} stowage positions from ${name}`, 'ok');
}
function closeFile() {
  Object.assign(S, { name: '', parsed: null, recs: [], filtered: [] });
  $('#main').style.display = 'none'; $('#landing').style.display = 'grid';
  $('#btnExport').disabled = true; $('#btnClear').disabled = true; $('#fileinfo').innerHTML = '';
  $('#fileInput').value = '';
}

/* ---------------- Header / file info ---------------- */
function renderFileInfo() {
  const i = S.info, v = S.parsed.validation;
  const ver = [i.messageType, i.version, i.assoc].filter(Boolean).join(' · ');
  $('#fileinfo').innerHTML = `<span class="pill" title="${esc(S.name)}">${esc(S.name)}</span>
    <span class="pill or">${esc(ver || 'EDIFACT')}</span>
    ${v.valid ? '<span class="pill ok">✓ Structure valid</span>' : `<span class="pill bad" id="pillBad">⚠ ${v.issues.length} issue(s)</span>`}`;
  const pb = $('#pillBad'); if (pb) pb.onclick = () => switchTab('info');
}
function renderVoyage() {
  const i = S.info;
  const kv = (k, v) => v ? `<div class="kv"><b>${k}</b><span>${esc(v)}</span></div>` : '';
  $('#voy').innerHTML = kv('Vessel', i.vesselName) + kv(/^(146|IMO)$/i.test(i.vesselIdType || '') ? 'IMO' : 'Vessel ID', i.vesselId) +
    kv('Voyage', i.voyage) + kv('Carrier', i.carrier) + kv('Port', i.depPort) + kv('Next port', i.nextPort) +
    kv('ETA', i.eta) + kv('ATA', i.ata) + kv('ATD', i.atd) + kv('Doc date', i.docDate) + kv('Sender', i.sender);
}

/* ---------------- Sidebar filters ---------------- */
function counts(key) {
  const m = new Map();
  for (const r of S.recs) { const v = r[key] || BLANK; m.set(v, (m.get(v) || 0) + 1); }
  return [...m.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(b[0]));
}
function msGroup(key, field, title, open) {
  const list = counts(field);
  const items = list.map(([v, c]) => `<label class="ms-item" data-v="${esc(v)}"><input type="checkbox" data-ms="${key}" value="${esc(v)}"><span>${esc(v)}</span><span class="c">${c}</span></label>`).join('');
  return `<details class="fgroup" ${open ? 'open' : ''}><summary>${title}<span class="cnt" id="cnt-${key}"></span></summary><div class="fbody">
    <div class="ms-tools">${list.length > 6 ? `<input class="inp" placeholder="Search…" data-mssearch="${key}">` : '<span style="flex:1"></span>'}
    <button class="link" data-msall="${key}">All</button><button class="link" data-msnone="${key}">Clear</button></div>
    <div class="ms-list" id="ms-${key}">${items}</div><div class="hint">Nothing ticked = no filter</div></div></details>`;
}
function chipGroup(key, field, title, order) {
  let list = counts(field);
  if (order) list.sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0]));
  return `<div class="lbl">${title}</div><div class="chips">${list.map(([v, c]) => `<span class="chip" data-chip="${key}" data-v="${esc(v)}">${esc(v)}<span class="c">${c}</span></span>`).join('')}</div>`;
}
function tri(key, label) {
  return `<div class="tri"><span>${label}</span><div class="seg" data-tri="${key}">
    <button data-v="any" class="on">Any</button><button data-v="yes">Only</button><button data-v="no">Exclude</button></div></div>`;
}
function renderSidebar() {
  $('#side').innerHTML = `
    <div class="sidehead"><h3>Filters</h3><button class="link" id="resetAll">Reset all</button></div>
    <div class="fgroup" style="padding:10px 12px"><input class="inp" id="q" placeholder="Search container, booking or position…"></div>
    ${msGroup('op', 'operator', 'Container operator', true)}
    ${msGroup('pod', 'pod', 'Port of discharge (POD)', true)}
    ${msGroup('pol', 'pol', 'Port of loading (POL)', false)}
    ${msGroup('dlv', 'dlv', 'Place of delivery', false)}
    <details class="fgroup" open><summary>Equipment<span class="cnt" id="cnt-eq"></span></summary><div class="fbody">
      ${chipGroup('size', 'size', 'Size (ft)', ['20', '40', '45', '48', '53'])}
      ${chipGroup('type', 'type', 'Type')}
      ${chipGroup('fe', 'fe', 'Full / Empty')}
    </div></details>
    <details class="fgroup" open><summary>Special cargo<span class="cnt" id="cnt-sp"></span></summary><div class="fbody">
      ${tri('reefer', 'Reefer')}${tri('dg', 'Dangerous')}${tri('oog', 'Out of gauge')}
    </div></details>
    <details class="fgroup"><summary>Stowage &amp; weight<span class="cnt" id="cnt-sw"></span></summary><div class="fbody">

/* ---------------- Filtering ---------------- */
function apply() {
  const f = S.f, num = v => v === '' ? null : Number(v);
  const bf = num(f.bayFrom), bt = num(f.bayTo), wn = num(f.wMin), wx = num(f.wMax), q = f.q.toUpperCase();
  const inSet = (s, v) => !s.size || s.has(v || BLANK);
  const triOk = (mode, val) => mode === 'any' || (mode === 'yes') === !!val;
  S.filtered = S.recs.filter(r =>
    inSet(f.op, r.operator) && inSet(f.pol, r.pol) && inSet(f.pod, r.pod) && inSet(f.dlv, r.dlv) &&
    inSet(f.size, r.size) && inSet(f.type, r.type) && inSet(f.fe, r.fe) &&
    triOk(f.reefer, r.reefer) && triOk(f.dg, r.isDG) && triOk(f.oog, r.isOOG) &&
    (bf == null || (r.bay != null && r.bay >= bf)) && (bt == null || (r.bay != null && r.bay <= bt)) &&
    (wn == null || (r.weight != null && r.weight >= wn)) && (wx == null || (r.weight != null && r.weight <= wx)) &&
    (!q || r.cntr.toUpperCase().includes(q) || r.booking.toUpperCase().includes(q) || r.pos.includes(q))
  );
  S.page = 1; doSort(); syncBadges(); renderStats(); renderTable(); renderOps(); renderPorts();
}

/* ---------------- Stats ---------------- */
function agg(list) {
  const a = { n: list.length, teu: 0, w: 0, rf: 0, dg: 0, oog: 0, full: 0, empty: 0, s20: 0, s40: 0, s45: 0, ops: new Set() };
  for (const r of list) {
    a.teu += r.teu || 0; a.w += r.weight || 0; if (r.reefer) a.rf++; if (r.isDG) a.dg++; if (r.isOOG) a.oog++;
    if (r.fe === 'Full') a.full++; else if (r.fe === 'Empty') a.empty++;
    const n = parseFloat(r.size); if (n && n < 30) a.s20++; else if (n >= 45) a.s45++; else if (n >= 30) a.s40++;
    a.ops.add(r.operator || BLANK);
  }
  return a;
}
function renderStats() {
  const A = agg(S.recs), F = agg(S.filtered);
  const card = (t, v, tot) => `<div class="stat"><b>${t}</b><div class="v">${v}</div><div class="t">of ${tot}</div></div>`;
  $('#stats').innerHTML = card('Containers', nf(F.n), nf(A.n)) + card('TEU', nf(F.teu), nf(A.teu)) +
    card('Weight (t)', nf(F.w / 1000), nf(A.w / 1000)) + card('Operators', F.ops.size, A.ops.size) +
    card('Reefers', nf(F.rf), nf(A.rf)) + card('Dangerous', nf(F.dg), nf(A.dg)) + card('OOG', nf(F.oog), nf(A.oog));
}

function fmtPos(r) { return r.bay != null ? `${String(r.bay).padStart(3, '0')} ${String(r.row).padStart(2, '0')} ${String(r.tier).padStart(2, '0')}` : r.pos; }
function doSort() {

function renderTable() {

const safeName = s => String(s).replace(/[\\/:*?"<>|\s]+/g, '_').replace(/^_+|_+$/g, '') || 'X';
const baseName = () => S.name.replace(/\.[^.]+$/, '') || 'baplie';
const extName = () => (S.name.match(/\.[^.]+$/) || ['.edi'])[0];
function singleName() {
  const ops = [...S.f.op];
  const tag = ops.length && ops.length <= 3 ? ops.map(safeName).join('-') : (S.filtered.length === S.recs.length ? 'all' : 'filtered');
  return `${safeName(baseName())}_${tag}${extName()}`;
}

// Plan of files to be produced for the current settings
function exportPlan() {
  if (S.exp.mode === 'single') {
    return [{ name: singleName(), label: 'All filtered operators', recs: S.filtered, expectOperator: null }];
  }
  const groups = new Map();
  for (const r of S.filtered) { const k = r.operator || ''; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
  let list = [...groups.entries()].sort((a, b) => (a[0] === '') - (b[0] === '') || a[0].localeCompare(b[0]));
  if (!S.exp.includeBlank) list = list.filter(([k]) => k !== '');
  const used = new Set();
  return list.map(([op, recs]) => {
    let name = `${safeName(baseName())}_${op ? safeName(op) : 'NO-OPERATOR'}${extName()}`, i = 2;
    while (used.has(name.toLowerCase())) name = name.replace(/(\.[^.]+)$/, `_${i++}$1`);
    used.add(name.toLowerCase());
    return { name, label: op || BLANK, recs, expectOperator: op };
  });
}

      ✓ Envelope (UNA/UNB/UNZ) and message header (UNH, BGM, DTM, TDT, LOC …) retained in every file<br>
      ✓ Each container's complete segment group is written exactly as in the source<br>
      ✓ UNT segment count recalculated for each file · original delimiters, encoding and line format preserved<br>
      ✓ Every file is re-parsed and validated before download${E.mode === 'split' ? ' · operator content verified per file' : ''}
    </div>
    ${F.n === 0 ? '<div class="warnbox">The current filter matches no containers.</div>' : ''}
  </div>
  <footer><button class="btn" data-close>Cancel</button><button class="btn primary" id="doExport" ${plan.length && total ? '' : 'disabled'}>${btnLabel}</button></footer>`);
}
function wireExportModal() {
  $('#modal').addEventListener('change', e => {
    const t = e.target; if (!$('#doExport')) return;
    if (t.name === 'xmode') { S.exp.mode = t.value; renderExportModal(); }
    else if (t.name === 'xdel') { S.exp.delivery = t.value; renderExportModal(); }
    else if (t.id === 'xref') { S.exp.uniqueRef = t.checked; renderExportModal(); }
    else if (t.id === 'xblank') { S.exp.includeBlank = t.checked; renderExportModal(); }
  });
  $('#modal').addEventListener('input', e => { if (e.target.id === 'expName') S.exp.singleName = e.target.value; });
  $('#modal').addEventListener('click', e => { if (e.target.closest('#doExport')) doExport(); });
}

function toBytes(str) { // byte-preserving (latin-1) conversion of what was read
  const b = new Uint8Array(str.length);
  for (let i = 0; i < str.length; i++) b[i] = str.charCodeAt(i) & 0xFF;
  return b;
}
function download(name, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

function doExport() {
  const E = S.exp, plan = exportPlan(), origRef = S.info.interchangeRef || '';
  if (E.mode === 'single') {
    const nm = (($('#expName') && $('#expName').value.trim()) || singleName());
    plan[0].name = /\.[A-Za-z0-9]+$/.test(nm) ? nm : nm + '.edi';
  }
  const results = [];
  for (let i = 0; i < plan.length; i++) {
    const f = plan[i];
    const opts = { expectOperator: f.expectOperator };
    if (E.mode === 'split' && E.uniqueRef) opts.interchangeRef = BP.deriveRef(origRef, i + 1);
    const r = BP.exportAndCheck(S.parsed, f.recs.map(x => x.block), opts);
    if (r.problems.length) {
      toast(`Export stopped. "${f.name}" failed validation: ${r.problems.join(' ')}`, 'err');
      return;
    }
    results.push({ name: f.name, bytes: toBytes(r.text), count: r.count });
  }
  S.exp.singleName = '';
  closeModal();
  const total = results.reduce((s, r) => s + r.count, 0);
  if (E.mode === 'single') {
    download(results[0].name, new Blob([results[0].bytes], { type: 'application/octet-stream' }));
    toast(`Exported ${total.toLocaleString()} containers to ${results[0].name} · structure validated ✓`, 'ok');
  } else if (E.delivery === 'zip') {
    const zipName = `${safeName(baseName())}_by_operator.zip`;
    download(zipName, new Blob([makeZip(results)], { type: 'application/zip' }));
    toast(`Exported ${results.length} operator files (${total.toLocaleString()} containers) in ${zipName} · all validated ✓`, 'ok');
  } else {
    results.forEach((r, i) => setTimeout(() => download(r.name, new Blob([r.bytes], { type: 'application/octet-stream' })), i * 450));
    toast(`Downloading ${results.length} operator files (${total.toLocaleString()} containers) · all validated ✓. If only one file arrives, allow multiple downloads for this page.`, 'ok');
  }
}

/* ---------------- Minimal ZIP writer (STORE, no compression, no dependencies) ---------------- */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) {
  const now = new Date();
  const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const enc = new TextEncoder();
  const parts = [], central = []; let offset = 0;
  for (const f of files) {
    const nameB = enc.encode(f.name), data = f.bytes, crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, nameB.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nameB, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, nameB.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nameB);
    offset += 30 + nameB.length + data.length;
  }
  const cdSize = central.reduce((s, p) => s + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  const all = [...parts, ...central, new Uint8Array(end.buffer)];
  const out = new Uint8Array(all.reduce((s, p) => s + p.length, 0));
  let o = 0; for (const p of all) { out.set(p, o); o += p.length; }
  return out;
}

/* ---------------- Modal / tabs / toast ---------------- */
function openModal(html) { $('#modal').innerHTML = html; $('#overlay').classList.add('on'); }
function closeModal() { $('#overlay').classList.remove('on'); $('#modal').innerHTML = ''; }
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay' || e.target.closest('[data-close]')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function switchTab(t) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'pane-' + t));
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) switchTab(b.dataset.tab); });
function toast(msg, kind) {
  const d = document.createElement('div'); d.className = kind || ''; d.textContent = msg; $('#toast').appendChild(d);
  setTimeout(() => d.remove(), kind === 'err' ? 9000 : 5500);
}

/* ---------------- Drag & drop / buttons ---------------- */
const fi = $('#fileInput');
fi.addEventListener('change', () => loadFile(fi.files[0]));
$('#btnOpen').onclick = $('#btnBrowse').onclick = e => { e.stopPropagation(); fi.value = ''; fi.click(); };
$('#drop').onclick = () => { fi.value = ''; fi.click(); };
$('#btnSample').onclick = e => { e.stopPropagation(); loadText(BP.makeSample(), 'DEMO_BAPLIE_D95B.edi'); };
$('#btnClear').onclick = closeFile;
$('#btnExport').onclick = openExport;
let dragDepth = 0;
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; $('#dropveil').classList.add('on'); $('#drop').classList.add('over'); });
window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $('#dropveil').classList.remove('on'); $('#drop').classList.remove('over'); } });
window.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; $('#dropveil').classList.remove('on'); $('#drop').classList.remove('over');
  const files = e.dataTransfer && e.dataTransfer.files;
  if (!files || !files.length) return;
  if (files.length > 1) toast('Multiple files dropped – loading the first one: ' + files[0].name);
  loadFile(files[0]);
});

wireSidebar(); wireTable(); wireSummaries(); wireExportModal();
})();

</script>
